# Claude Code as the source environment.
# Every entry is taken from the official documentation at https://code.claude.com/docs/en/.
# Hashes are computed over the markdown version of the page (`<url>.md`), normalization v1.
schema_version: 1
vendor: anthropic
environment: claude-code
version_range: ">=2.1.0,<2.2.0"
checked_at: 2026-09-14
stale_after_days: 30
normalization: v1

