# Entry ids follow the vocabulary of the source environment description so that the two
# layouts can be compared entry by entry. A root the documentation does not name simply
# has no entry here — there is no such thing as an "unknown path".
layout:
  # Inside one skill. The paths are written from the skill root, as the specification writes
  # them, so that the two can be matched: this page draws them under `.agents/skills/`, which
  # `skills.project` below already records.
  - id: skill.file
    path: "<skill-name>/SKILL.md"
    source_id: skills-structure
  - id: skill.dir.scripts
    path: "<skill-name>/scripts/"
    source_id: skills-structure
  # Two bundle directories with no counterpart in the specification: it names `references/`
  # and `assets/`, this page names these. Different names are different places, and reading
  # one as the other would credit Antigravity with reproducing something it never wrote.
  - id: skill.dir.examples
    path: "<skill-name>/examples/"
    source_id: skills-structure
  - id: skill.dir.resources
    path: "<skill-name>/resources/"
    source_id: skills-structure
  - id: skills.project
    path: "<workspace-root>/.agents/skills/"
    source_id: skills-location
  - id: skills.user
    path: "~/.gemini/config/skills/"
    source_id: skills-location
  - id: agents.project
    path: ".agents/agents/"
    source_id: subagents-location
  - id: agents.user
    path: "~/.gemini/config/agents/"
    source_id: subagents-location
  - id: agents.plugin
    path: "plugins/<plugin_name>/agents/"
    source_id: subagents-location
  - id: hooks.project
    path: ".agents/hooks.json"
    source_id: hooks-config
  - id: hooks.user
    path: "~/.gemini/config/hooks.json"
    source_id: hooks-config
  - id: hooks.plugin
    path: "plugins/<plugin-name>/hooks.json"
    source_id: plugins-structure
  - id: settings.user
    path: "~/.gemini/antigravity-cli/settings.json"
    source_id: cli-settings-file
  # Roots with no counterpart in the source environment.
  # `rules.*` is named after what the documentation calls it — global and workspace rules.
  # It is not recorded as agent memory: no page says these files serve that role.
  - id: rules.project
    path: ".agents/rules/"
    source_id: rules-workspace
  - id: rules.user
    path: "~/.gemini/GEMINI.md"
    source_id: rules-global
  - id: plugins.project
    path: ".agents/plugins/"
    source_id: plugins-locations
  - id: plugins.user
    path: "~/.gemini/config/plugins/"
    source_id: plugins-locations
  - id: mcp.project
    path: ".agents/mcp_config.json"
    source_id: mcp-cli-configs
  - id: mcp.user
    path: "~/.gemini/config/mcp_config.json"
    source_id: mcp-cli-configs

limits:
  # The only size limit the documentation states in a unit: "Rules files are limited to
  # 12,000 characters each." No skill file or skill bundle size limit is documented.
  - id: rules.file.size
    value: 12000
    unit: characters
    source_id: rules-overview

# Empty, and that emptiness is itself a finding: see `agent.tool-names.mapping` above.
# The documentation names the Antigravity tool set under "Supported Tools" but nowhere
# states how a Claude Code tool name maps onto an Antigravity one — the word "Claude"
# appears in it only as a model name and in an FAQ answer about third-party clients.
# Pairing `Read` with `view_file` would be our guess, not the vendor's statement.
tool_names: []

# Only the source environment declares configuration the adapter cannot see (R28).
invisible_sources: []

# Written by the freshness check, never by hand.
discrepancies: []
