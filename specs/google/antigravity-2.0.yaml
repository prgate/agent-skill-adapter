  # --- SKILL.md -------------------------------------------------------------
  - id: skill.frontmatter.name
    kind: skill-field
    support: supported
    source_id: skills-frontmatter
    note: "Optional; defaults to the folder name when omitted."
  - id: skill.frontmatter.description
    kind: skill-field
    support: supported
    source_id: skills-frontmatter
    note: "Required; this is what the agent sees when deciding whether to apply the skill."
  - id: skill.frontmatter.allowed-tools
    kind: skill-field
    support: unknown
    source_id: skills-frontmatter
    note: >-
      The frontmatter table lists only `name` and `description`. It does not state that a
      tool-restriction field is rejected or ignored, so this is silence, not a denial.
