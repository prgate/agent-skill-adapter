  # A ceiling measured in nesting levels, which `limits` cannot carry: its unit vocabulary
  # is bytes / characters / tokens and is not widened (FR-32). Per decision D02 a ceiling of
  # another nature is recorded as an ordinary capability with the number named in the note.
  - id: subagent.limit.spawn-depth
    kind: subagent-field
    support: supported
    source_id: subagents-nesting
    note: >-
      A maximum nesting depth of 10 levels of subagents beneath the primary agent is
      strictly enforced, to prevent runaway recursion or resource exhaustion.
  - id: subagent.limit.concurrent
    kind: subagent-field
    support: unknown
    source_id: subagents-nesting
    note: >-
      The one ceiling this section states as strictly enforced is the nesting depth. It
      names no cap on the number of concurrently running subagents, and rules none out.
  # The tool-name mapping the adapter needs in order to rewrite `tools:`, `allowed-tools:`
  # and hook matchers for this environment.
  #
  # Our own observation, which no single section asserts and therefore no hash guards: we
  # read all 91 documentation pages listed in https://antigravity.google/llms.txt, and none
  # of them pairs an Antigravity tool name with the tool name of another environment. The
  # word "Claude" occurs only as a model name and in an FAQ answer about third-party
  # clients. The note below stays inside what "Supported Tools" itself says.
  - id: agent.tool-names.mapping
    kind: subagent-field
    support: unknown
    source_id: hooks-tools
    note: >-
      This section names the twenty tool names a matcher can be written against —
      `view_file`, `write_to_file`, `replace_file_content`, `multi_replace_file_content`,
      `list_dir`, `find_by_name`, `grep_search`, `search_web`, `read_url_content`,
      `run_command`, `manage_task`, `schedule`, `list_permissions`, `ask_permission`,
      `invoke_subagent`, `define_subagent`, `send_message`, `manage_subagents`,
      `ask_question`, `generate_image` — and pairs them with nothing: it gives the
      Antigravity spelling of a tool, never the spelling any other environment uses.

  # --- Hook events ----------------------------------------------------------
  # The documented event set is PreToolUse, PostToolUse, PreInvocation, PostInvocation, Stop.
  # Events the page does not name are recorded as `unknown`: the page enumerates what it
  # supports, it never states that any other event is absent.
  - id: hook.event.PreToolUse
    kind: hook-event
    support: supported
    source_id: hooks-events
    note: "Fires before a tool is executed; the matcher targets the tool name."
  - id: hook.event.PostToolUse
    kind: hook-event
    support: supported
    source_id: hooks-events
    note: "Fires after a tool completes; the matcher targets the tool name."
  - id: hook.event.Stop
    kind: hook-event
    support: supported
    source_id: hooks-events
    note: "Fires when the execution loop terminates; the matcher is ignored."
  - id: hook.event.PreInvocation
    kind: hook-event
    support: supported
    source_id: hooks-events
    note: "Antigravity-specific: fires before the model is called; the matcher is ignored."
  - id: hook.event.PostInvocation
    kind: hook-event
    support: supported
    source_id: hooks-events
    note: "Antigravity-specific: fires after each model invocation; the matcher is ignored."
  - id: hook.event.UserPromptSubmit
    kind: hook-event
    support: unknown
    source_id: hooks-events
    note: "Absent from the supported-events table; the page does not say it is unavailable."
