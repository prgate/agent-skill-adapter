    provenance:
      url: https://code.claude.com/docs/en/skills
      anchor: '#frontmatter-reference'
      hash: sha256:6dbb04c84b9443feb6a68dfb175fb423d70811ef26751d7b4058df372d93930f
      checkedAt: 2026-09-13
