  version: 1.0.0
  labels:
    vendor: anthropic
    role: source
  annotations:
    adapter.prgate.io/changelog: CHANGELOG.md
spec:
  extends: agentskills@1.0.0
  environment:
    versions: '>=2.1.218,<2.2.0'
  validForDays: 90
  layout:
    skillFile:
    - SKILL.md
    skillsDirs:
    - path: .claude/skills
      scope: project
    - path: ~/.claude/skills
      scope: user
    conventionalDirs: []
    provenance:
      url: https://code.claude.com/docs/en/skills
      anchor: '#where-skills-live'
      hash: sha256:7e8dcfbf937bf2c4e8a36baff4cee1d982dde0c7c4c002275a6b50fe0d617320
      checkedAt: 2026-09-13
  skillFields:
  - name: agent
    kind: string
    values: []
    required: false
    stability: stable
    effect: Which subagent type to use when context is fork.
    provenance:
      url: https://code.claude.com/docs/en/skills
      anchor: '#frontmatter-reference'
      hash: sha256:6dbb04c84b9443feb6a68dfb175fb423d70811ef26751d7b4058df372d93930f
      checkedAt: 2026-09-13
  - name: allowed-tools
    kind: list[string]
    values: []
    required: false
    stability: stable
    effect: Tools Claude can use without asking permission during the turn that invokes this skill; accepts
      a space- or comma-separated string, or a YAML list.
    provenance:
      url: https://code.claude.com/docs/en/skills
      anchor: '#frontmatter-reference'
      hash: sha256:6dbb04c84b9443feb6a68dfb175fb423d70811ef26751d7b4058df372d93930f
      checkedAt: 2026-09-13
  - name: argument-hint
    kind: string
    values: []
    required: false
    stability: stable
    effect: Hint shown during autocomplete to indicate expected arguments.
    provenance:
      url: https://code.claude.com/docs/en/skills
      anchor: '#frontmatter-reference'
      hash: sha256:6dbb04c84b9443feb6a68dfb175fb423d70811ef26751d7b4058df372d93930f
      checkedAt: 2026-09-13
  - name: arguments
    kind: list[string]
    values: []
    required: false
    stability: stable
    effect: Named positional arguments for $name substitution in the skill content; accepts a space-separated
      string or a YAML list.
    provenance:
      url: https://code.claude.com/docs/en/skills
      anchor: '#frontmatter-reference'
      hash: sha256:6dbb04c84b9443feb6a68dfb175fb423d70811ef26751d7b4058df372d93930f
      checkedAt: 2026-09-13
  - name: background
    kind: bool
    values: []
    required: false
    stability: stable
    since: 2.1.218
    effect: Only applies with context fork; set to false to wait for the forked subagent's result in the
      invoking turn instead of running it in the background; default true.
    provenance:
      url: https://code.claude.com/docs/en/skills
      anchor: '#frontmatter-reference'
      hash: sha256:6dbb04c84b9443feb6a68dfb175fb423d70811ef26751d7b4058df372d93930f
      checkedAt: 2026-09-13
  - name: compatibility
    kind: string
    values: []
    required: false
    constraints:
      maxLength: 500
      matchesDirectoryName: false
    stability: stable
    effect: Environment requirements for the skill, as defined by the Agent Skills spec; Claude Code accepts
      the field but doesn't act on it.
    provenance:
      url: https://code.claude.com/docs/en/skills
      anchor: '#frontmatter-reference'
      hash: sha256:6dbb04c84b9443feb6a68dfb175fb423d70811ef26751d7b4058df372d93930f
      checkedAt: 2026-09-13
  - name: context
    kind: enum
    values:
    - fork
    required: false
    stability: stable
    effect: Set to fork to run in a forked subagent context.
    provenance:
      url: https://code.claude.com/docs/en/skills
      anchor: '#frontmatter-reference'
      hash: sha256:6dbb04c84b9443feb6a68dfb175fb423d70811ef26751d7b4058df372d93930f
      checkedAt: 2026-09-13
  - name: description
    kind: string
    values: []
    required: false
    stability: stable
    effect: What the skill does and when to use it; Claude uses this to decide when to apply the skill.
      Combined with when_to_use, truncated at 1,536 characters in the skill listing.
    provenance:
      url: https://code.claude.com/docs/en/skills
      anchor: '#frontmatter-reference'
      hash: sha256:6dbb04c84b9443feb6a68dfb175fb423d70811ef26751d7b4058df372d93930f
      checkedAt: 2026-09-13
  - name: disable-model-invocation
    kind: bool
    values: []
    required: false
    stability: stable
    effect: Set to true to prevent Claude from automatically loading this skill; default false.
    provenance:
      url: https://code.claude.com/docs/en/skills
      anchor: '#frontmatter-reference'
      hash: sha256:6dbb04c84b9443feb6a68dfb175fb423d70811ef26751d7b4058df372d93930f
      checkedAt: 2026-09-13
  - name: disallowed-tools
    kind: list[string]
    values: []
    required: false
    stability: stable
    effect: Tools removed from Claude's available pool while this skill is active; accepts a space- or
      comma-separated string, or a YAML list.
    provenance:
      url: https://code.claude.com/docs/en/skills
      anchor: '#frontmatter-reference'
      hash: sha256:6dbb04c84b9443feb6a68dfb175fb423d70811ef26751d7b4058df372d93930f
      checkedAt: 2026-09-13
  - name: effort
    kind: enum
    values:
    - low
    - medium
    - high
    - xhigh
    - max
    required: false
    stability: stable
    effect: Effort level when this skill is active; overrides the session effort level; available levels
      depend on the model.
    provenance:
      url: https://code.claude.com/docs/en/skills
      anchor: '#frontmatter-reference'
      hash: sha256:6dbb04c84b9443feb6a68dfb175fb423d70811ef26751d7b4058df372d93930f
      checkedAt: 2026-09-13
  - name: hooks
    kind: list[string]
    values: []
    required: false
    stability: stable
    effect: Hooks Claude Code registers when the skill is invoked and keeps running for the rest of the
      session; the configuration format is out of scope for this document.
    provenance:
      url: https://code.claude.com/docs/en/skills
      anchor: '#frontmatter-reference'
      hash: sha256:6dbb04c84b9443feb6a68dfb175fb423d70811ef26751d7b4058df372d93930f
      checkedAt: 2026-09-13
  - name: license
    kind: string
    values: []
    required: false
    stability: stable
    effect: License covering the skill, part of the Agent Skills spec; Claude Code accepts the field but
      doesn't act on it.
    provenance:
      url: https://code.claude.com/docs/en/skills
      anchor: '#frontmatter-reference'
      hash: sha256:6dbb04c84b9443feb6a68dfb175fb423d70811ef26751d7b4058df372d93930f
      checkedAt: 2026-09-13
  - name: metadata
    kind: map
    values: []
    valueKind: string
    openKeys: true
    required: false
    stability: stable
    effect: Free-form YAML map for the caller's own key-value data; Claude Code doesn't act on its contents.
    provenance:
      url: https://code.claude.com/docs/en/skills
      anchor: '#frontmatter-reference'
      hash: sha256:6dbb04c84b9443feb6a68dfb175fb423d70811ef26751d7b4058df372d93930f
      checkedAt: 2026-09-13
  - name: model
    kind: string
    values: []
    required: false
    stability: stable
    effect: Model to use when this skill is active; overrides the session model for the rest of the current
      turn.
    provenance:
      url: https://code.claude.com/docs/en/skills
      anchor: '#frontmatter-reference'
      hash: sha256:6dbb04c84b9443feb6a68dfb175fb423d70811ef26751d7b4058df372d93930f
      checkedAt: 2026-09-13
  - name: name
    kind: string
    values: []
    required: false
    stability: stable
    effect: Display name shown in skill listings; defaults to the directory name.
    provenance:
      url: https://code.claude.com/docs/en/skills
      anchor: '#frontmatter-reference'
      hash: sha256:6dbb04c84b9443feb6a68dfb175fb423d70811ef26751d7b4058df372d93930f
      checkedAt: 2026-09-13
  - name: paths
    kind: list[string]
    values: []
    required: false
    stability: stable
    effect: Glob patterns that limit when this skill is activated; Claude loads it automatically only
      when working with matching files; accepts a comma-separated string or a YAML list.
    provenance:
      url: https://code.claude.com/docs/en/skills
      anchor: '#frontmatter-reference'
      hash: sha256:6dbb04c84b9443feb6a68dfb175fb423d70811ef26751d7b4058df372d93930f
      checkedAt: 2026-09-13
  - name: shell
    kind: enum
    values:
    - bash
    - powershell
    required: false
    stability: stable
    effect: Shell used for inline and fenced shell command blocks in this skill; default bash.
    provenance:
      url: https://code.claude.com/docs/en/skills
      anchor: '#frontmatter-reference'
      hash: sha256:6dbb04c84b9443feb6a68dfb175fb423d70811ef26751d7b4058df372d93930f
      checkedAt: 2026-09-13
  - name: user-invocable
    kind: bool
    values: []
    required: false
    stability: stable
    effect: Set to false so only Claude can invoke the skill; Claude Code hides it from the / menu; default
